<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>环境检测</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e3e7f0; --text:#10131a; --muted:#687089;
    --accent:#2f6df6; --ok:#1a9d63; --warn:#c98a00; --bad:#d93636; --chip:#eef2fd;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0e14; --card:#121722; --line:#222a3a; --text:#e8edf7; --muted:#8b95ab;
      --accent:#5b8cff; --ok:#35c98a; --warn:#e3b341; --bad:#ff6b6b; --chip:#182034;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;
    padding:18px 16px 40px;line-height:1.5;
  }
  header{padding:4px 2px 16px}
  .eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--accent);text-transform:uppercase}
  h1{font-size:26px;margin:6px 0 6px;letter-spacing:-.02em}
  .sub{margin:0;color:var(--muted);font-size:13px}
  .scoreBox{
    margin-top:16px;display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;
  }
  .score{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;min-width:64px}
  .score small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
  .scoreHint{font-size:13px;color:var(--muted)}
  .scoreHint b{color:var(--text)}
  section.card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;margin-top:14px;
  }
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
  .rows{display:flex;flex-direction:column}
  .row{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
  .row:first-child{border-top:0;padding-top:0}
  .row .k{color:var(--muted);flex:0 0 92px}
  .row .v{flex:1;min-width:0;word-break:break-all;font-variant-numeric:tabular-nums}
  ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.checks li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
  .dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .checkText{flex:1;min-width:0}
  .checkText em{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:1px;word-break:break-all}
  .pill{display:inline-block;background:var(--chip);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px}
  footer{margin-top:18px;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.6}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Environment Check</div>
  <h1>环境检测</h1>
  <p class="sub">检查当前环境的出口 IP、时区、语言、指纹与 WebRTC 是否自洽。</p>
  <div class="scoreBox">
    <div class="score" id="score">--<small>分</small></div>
    <div class="scoreHint" id="scoreHint"><span class="spin"></span>正在检测…</div>
  </div>
</header>

<section class="card">
  <h2>网络</h2>
  <div class="rows" id="netRows"></div>
</section>

<section class="card">
  <h2>一致性</h2>
  <ul class="checks" id="checks">
    <li><span class="dot"></span><span class="checkText">正在等待检测结果…</span></li>
  </ul>
</section>

<section class="card">
  <h2>指纹</h2>
  <div class="rows" id="fpRows"></div>
</section>

<footer>
  检测结果仅反映当前页面可见的信息，不代表目标网站的判定结果。<br>
  IP 数据来自公共接口，可能存在缓存延迟。
</footer>

<script>
(function () {
  "use strict";

  var checks = [];
  var netReady = false;

  function addCheck(state, label, detail) {
    checks.push({ state: state, label: label, detail: detail || "" });
  }

  function row(container, key, value) {
    var el = document.createElement("div");
    el.className = "row";
    var k = document.createElement("div");
    k.className = "k";
    k.textContent = key;
    var v = document.createElement("div");
    v.className = "v";
    v.textContent = value == null || value === "" ? "—" : String(value);
    el.appendChild(k);
    el.appendChild(v);
    container.appendChild(el);
  }

  function canvasHash() {
    try {
      var c = document.createElement("canvas");
      c.width = 240; c.height = 60;
      var ctx = c.getContext("2d");
      ctx.textBaseline = "top";
      ctx.font = "16px sans-serif";
      ctx.fillStyle = "#f60";
      ctx.fillRect(0, 0, 240, 60);
      ctx.fillStyle = "#069";
      ctx.fillText("OpenBrowser 环境检测", 8, 8);
      var data = c.toDataURL();
      var h = 0;
      for (var i = 0; i < data.length; i++) h = (h * 31 + data.charCodeAt(i)) | 0;
      return (h >>> 0).toString(16).padStart(8, "0");
    } catch (e) {
      return "n/a";
    }
  }

  function webglInfo() {
    try {
      var c = document.createElement("canvas");
      var gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if (!gl) return ["n/a", "n/a"];
      var dbg = gl.getExtension("WEBGL_debug_renderer_info");
      if (dbg) {
        return [
          gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL),
          gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
        ];
      }
      return [gl.getParameter(gl.VENDOR), gl.getParameter(gl.RENDERER)];
    } catch (e) {
      return ["n/a", "n/a"];
    }
  }

  function fetchJson(url, timeout) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var opts = ctrl ? { signal: ctrl.signal, cache: "no-store" } : { cache: "no-store" };
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, timeout || 7000);
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).finally(function () { clearTimeout(timer); });
  }

  function lookupIp() {
    return fetchJson("https://ipwho.is/").then(function (d) {
      if (!d || d.success === false) throw new Error("ipwho.is");
      return {
        ip: d.ip,
        country: d.country,
        countryCode: d.country_code,
        city: d.city,
        region: d.region,
        timezone: d.timezone && d.timezone.id,
        org: d.connection && (d.connection.isp || d.connection.org)
      };
    }).catch(function () {
      return fetchJson("https://ipinfo.io/json").then(function (d) {
        if (!d || !d.ip) throw new Error("ipinfo.io");
        return {
          ip: d.ip,
          country: d.country,
          countryCode: d.country,
          city: d.city,
          region: d.region,
          timezone: d.timezone,
          org: d.org
        };
      });
    }).catch(function () {
      return fetchJson("https://api.ipify.org?format=json").then(function (d) {
        if (!d || !d.ip) throw new Error("ipify");
        return { ip: d.ip };
      });
    });
  }

  function webrtcIps() {
    return new Promise(function (resolve) {
      var pc;
      var done = false;
      var found = {};
      function finish() {
        if (done) return;
        done = true;
        try { if (pc) pc.close(); } catch (e) {}
        resolve(Object.keys(found));
      }
      try {
        if (typeof RTCPeerConnection === "undefined") return resolve(null);
        pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
        pc.onicecandidate = function (e) {
          if (!e.candidate) return;
          var m = /([0-9]{1,3}(?:\.[0-9]{1,3}){3}|[a-f0-9]{1,4}(?::[a-f0-9]{0,4}){2,7})/i.exec(e.candidate.candidate);
          if (m) found[m[1]] = true;
        };
        pc.createDataChannel("check");
        pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).catch(finish);
        setTimeout(finish, 2600);
      } catch (e) {
        resolve(null);
      }
    });
  }

  function isPrivate(ip) {
    return /^(10\.|127\.|169\.254\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|fe80:|::1)/i.test(ip);
  }

  var localeCountry = {
    "zh": "CN", "en": "US", "ja": "JP", "ko": "KR", "de": "DE", "fr": "FR",
    "es": "ES", "ru": "RU", "pt": "BR", "it": "IT", "nl": "NL", "vi": "VN",
    "th": "TH", "id": "ID", "tr": "TR", "ar": "SA", "hi": "IN"
  };

  function render() {
    var box = document.getElementById("checks");
    box.innerHTML = "";
    checks.forEach(function (c) {
      var li = document.createElement("li");
      var dot = document.createElement("span");
      dot.className = "dot " + c.state;
      var text = document.createElement("span");
      text.className = "checkText";
      text.textContent = c.label;
      if (c.detail) {
        var em = document.createElement("em");
        em.textContent = c.detail;
        text.appendChild(em);
      }
      li.appendChild(dot);
      li.appendChild(text);
      box.appendChild(li);
    });

    var bad = 0, warn = 0;
    checks.forEach(function (c) {
      if (c.state === "bad") bad++;
      else if (c.state === "warn") warn++;
    });
    var score = Math.max(0, Math.min(100, 100 - bad * 22 - warn * 9));
    var scoreEl = document.getElementById("score");
    scoreEl.innerHTML = score + "<small>分</small>";
    scoreEl.style.color = bad > 0 ? "var(--bad)" : (warn > 0 ? "var(--warn)" : "var(--ok)");

    var hint = document.getElementById("scoreHint");
    if (bad > 0) hint.innerHTML = "发现 <b>" + bad + "</b> 项高风险问题" + (warn ? "，" + warn + " 项需注意" : "");
    else if (warn > 0) hint.innerHTML = "整体可用，有 <b>" + warn + "</b> 项需要留意";
    else hint.innerHTML = "各项检测通过，环境看起来自洽";
  }

  // 指纹部分（同步）
  var fp = document.getElementById("fpRows");
  var nav = navigator;
  var tz = "";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
  var gl = webglInfo();

  row(fp, "User-Agent", nav.userAgent);
  row(fp, "Platform", nav.platform);
  row(fp, "语言", (nav.languages || [nav.language]).join(", "));
  row(fp, "时区", tz + " (UTC" + (new Date().getTimezoneOffset() > 0 ? "-" : "+") +
    Math.abs(new Date().getTimezoneOffset() / 60) + ")");
  row(fp, "屏幕", screen.width + "×" + screen.height + " @ " + (window.devicePixelRatio || 1) + "x");
  row(fp, "视口", window.innerWidth + "×" + window.innerHeight);
  row(fp, "CPU / 内存", (nav.hardwareConcurrency || "?") + " 核 / " + (nav.deviceMemory || "?") + " GB");
  row(fp, "触点", nav.maxTouchPoints + (nav.maxTouchPoints > 0 ? "（触屏）" : "（鼠标）"));
  row(fp, "WebGL", gl[0] + " / " + gl[1]);
  row(fp, "Canvas", canvasHash());

  // 网络部分（异步）
  var net = document.getElementById("netRows");
  row(net, "状态", "正在获取公网 IP…");

  var ipPromise = lookupIp().then(function (info) {
    net.innerHTML = "";
    row(net, "公网 IP", info.ip);
    row(net, "位置", [info.country, info.region, info.city].filter(Boolean).join(" · "));
    row(net, "运营商", info.org);
    row(net, "IP 时区", info.timezone);
    addCheck("ok", "出口 IP 获取成功", info.ip + (info.countryCode ? " · " + info.countryCode : ""));
    return info;
  }).catch(function () {
    net.innerHTML = "";
    row(net, "公网 IP", "获取失败");
    addCheck("warn", "出口 IP 获取失败", "可能是网络受限或接口不可用");
    return null;
  });

  var rtcPromise = webrtcIps().then(function (ips) {
    if (ips === null) {
      addCheck("ok", "WebRTC 不可用（已屏蔽）", "无法读取本地网络地址");
      return;
    }
    var leaks = ips.filter(function (ip) { return ip; });
    if (leaks.length === 0) {
      addCheck("ok", "WebRTC 未泄露地址", "未收集到 ICE 候选地址");
    } else {
      addCheck("bad", "WebRTC 可能泄露地址", leaks.join(", "));
    }
  });

  Promise.all([ipPromise, rtcPromise]).then(function (res) {
    var info = res[0];

    // 时区一致性
    if (info && info.timezone) {
      var ipTz = String(info.timezone);
      if (tz && tz.toLowerCase() === ipTz.toLowerCase()) {
        addCheck("ok", "时区与 IP 一致", tz);
      } else if (tz) {
        addCheck("warn", "时区与 IP 不一致", "页面 " + tz + "，IP " + ipTz);
      }
    }

    // 语言一致性
    if (info && info.countryCode) {
      var lang = (nav.language || "").split("-")[0].toLowerCase();
      var expect = localeCountry[lang];
      if (expect && info.countryCode) {
        if (expect.toUpperCase() === String(info.countryCode).toUpperCase()) {
          addCheck("ok", "语言与 IP 地区匹配", lang + " ↔ " + info.countryCode);
        } else {
          addCheck("warn", "语言与 IP 地区不匹配", lang + " ↔ " + info.countryCode);
        }
      }
    }

    // UA / 平台一致
    var ua = nav.userAgent || "";
    var platform = (nav.platform || "").toLowerCase();
    if (platform.indexOf("win") >= 0 && ua.indexOf("Windows") < 0) {
      addCheck("bad", "UA 与 Platform 不一致", "Platform=Windows，但 UA 不含 Windows");
    } else if (platform.indexOf("mac") >= 0 && ua.indexOf("Macintosh") < 0) {
      addCheck("bad", "UA 与 Platform 不一致", "Platform=macOS，但 UA 不含 Macintosh");
    } else if (platform.indexOf("linux") >= 0 && ua.indexOf("Linux") < 0 && ua.indexOf("Android") < 0) {
      addCheck("bad", "UA 与 Platform 不一致", "Platform=Linux，但 UA 不含 Linux/Android");
    } else {
      addCheck("ok", "UA 与 Platform 自洽");
    }

    // 触屏 / UA 一致性
    if (nav.maxTouchPoints > 0 && ua.indexOf("Mobile") < 0) {
      addCheck("warn", "有触摸点但 UA 不像手机", "maxTouchPoints=" + nav.maxTouchPoints + "，UA 缺少 Mobile 标识");
    }

    render();
  }).catch(function (e) {
    addCheck("warn", "检测未完成", String(e && e.message ? e.message : e));
    render();
  });
})();
</script>
</body>
</html>
